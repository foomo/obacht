rules:
  - id: DEMO001
    title: Docker socket is world-writable
    severity: critical
    category: demo
    description: |
      A world-writable Docker socket lets any local user gain root on the
      host by spawning a privileged container.
    remediation: "Run: sudo chmod 660 /var/run/docker.sock"

  - id: DEMO002
    title: SSH key uses weak algorithm
    severity: high
    category: demo
    description: |
      RSA keys under 3072 bits are below current NIST guidance.
    remediation: "Generate a stronger key: ssh-keygen -t ed25519 -a 100"

  - id: DEMO003
    title: SSH private key has weak permissions
    severity: high
    category: demo
    description: |
      SSH private keys should be readable only by the owner.
    remediation: "Run: chmod 600 ~/.ssh/id_*"

  - id: DEMO004
    title: Shell history is world-readable
    severity: warn
    category: demo
    description: |
      Shell history files often contain secrets pasted on the command line.
      World-readable history exposes them to any local user.
    remediation: "Run: chmod 600 ~/.bash_history ~/.zsh_history"
