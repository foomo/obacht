rules:
  - id: BUN001
    title: bun install.minimumReleaseAge is below 7 days
    severity: high
    category: bun
    description: |
      Bun 1.3+ supports `install.minimumReleaseAge` in bunfig.toml
      (value in seconds). Setting it to at least 604800 (7 days)
      blocks installation of fresh, potentially compromised package
      versions. The global bunfig is resolved from $BUN_CONFIG_FILE,
      $XDG_CONFIG_HOME/.bunfig.toml, then $HOME/.bunfig.toml.
    remediation: 'Add `[install]` `minimumReleaseAge = 604800` to `~/.bunfig.toml`'
