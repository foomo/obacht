rules:
  - id: CLD001
    title: Global gitignore does not exclude Claude Code local settings
    severity: warn
    category: claude
    description: |
      Claude Code stores user-specific settings in .claude/settings.local.json
      which may contain personal configuration. A global gitignore entry for
      **/.claude/settings.local.json prevents accidental commits.
    remediation: "Run: echo '**/.claude/settings.local.json' >> ~/.gitignore_global && git config --global core.excludesfile ~/.gitignore_global"
  - id: CLD002
    title: Claude Code autoCompactEnabled is not disabled
    severity: warn
    category: claude
    description: |
      Claude Code's auto-compact feature silently rewrites conversation
      context when token budgets are reached, which can drop critical
      details. Disabling it gives the user explicit control over when
      compaction happens.
    remediation: 'Set "autoCompactEnabled": false in ~/.claude.json (or $XDG_CONFIG_HOME/claude/.claude.json)'
  - id: CLD003
    title: Claude Code prStatusFooterEnabled is not disabled
    severity: info
    category: claude
    description: |
      The PR status footer makes outbound calls to GitHub to display PR
      status in the CLI footer. Disabling it reduces network chatter and
      avoids leaking working-directory metadata to remote services when
      not needed.
    remediation: 'Set "prStatusFooterEnabled": false in ~/.claude.json (or $XDG_CONFIG_HOME/claude/.claude.json)'
  - id: CLD004
    title: Claude Code claudeInChromeDefaultEnabled is not disabled
    severity: warn
    category: claude
    description: |
      The Claude-in-Chrome integration injects Claude into the default
      browser. Disabling the default-enable flag prevents unintended
      browser instrumentation and keeps Claude Code scoped to the
      terminal until explicitly opted in.
    remediation: 'Set "claudeInChromeDefaultEnabled": false in ~/.claude.json (or $XDG_CONFIG_HOME/claude/.claude.json)'
  - id: CLD005
    title: Claude Code sandbox.failIfUnavailable is not enabled
    severity: high
    category: claude
    description: |
      When sandbox.failIfUnavailable is false (or unset), Claude Code
      will silently run without the platform sandbox if it cannot be
      initialized, removing a key isolation boundary. Setting it to
      true forces Claude Code to fail closed when the sandbox is
      unavailable, ensuring tool execution always runs under the
      expected confinement.
    remediation: 'Set "sandbox": {"failIfUnavailable": true} in ~/.claude.json (or $XDG_CONFIG_HOME/claude/.claude.json)'
  - id: CLD006
    title: Claude Code DISABLE_COMPACT is not set in settings.json
    severity: warn
    category: claude
    description: |
      DISABLE_COMPACT="1" turns off the manual /compact command, which
      otherwise rewrites conversation history in place. Setting it
      removes a class of silent context mutations that can drop details
      the user expects to keep.
    remediation: 'Set "env": {"DISABLE_COMPACT": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD007
    title: Claude Code DISABLE_TELEMETRY is not set in settings.json
    severity: high
    category: claude
    description: |
      DISABLE_TELEMETRY="1" opts out of anonymized usage telemetry that
      Claude Code otherwise sends to Anthropic. Disabling it keeps
      command and tool-usage metadata local.
    remediation: 'Set "env": {"DISABLE_TELEMETRY": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD008
    title: Claude Code DISABLE_BUG_COMMAND is not set in settings.json
    severity: warn
    category: claude
    description: |
      DISABLE_BUG_COMMAND="1" hides the /bug command, which submits
      bug reports (potentially including transcript context) to
      Anthropic. Disabling it prevents accidental upload of working
      session content.
    remediation: 'Set "env": {"DISABLE_BUG_COMMAND": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD009
    title: Claude Code DISABLE_AUTO_COMPACT is not set in settings.json
    severity: warn
    category: claude
    description: |
      DISABLE_AUTO_COMPACT="1" disables automatic conversation
      compaction triggered when context fills up. Without it, Claude
      Code may silently rewrite the conversation, dropping details
      the user assumed were preserved.
    remediation: 'Set "env": {"DISABLE_AUTO_COMPACT": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD010
    title: Claude Code DISABLE_LOGIN_COMMAND is not set in settings.json
    severity: info
    category: claude
    description: |
      DISABLE_LOGIN_COMMAND="1" hides the /login command. In
      multi-account or shared environments this prevents accidental
      account switching from inside an active session.
    remediation: 'Set "env": {"DISABLE_LOGIN_COMMAND": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD011
    title: Claude Code DISABLE_LOGOUT_COMMAND is not set in settings.json
    severity: info
    category: claude
    description: |
      DISABLE_LOGOUT_COMMAND="1" hides the /logout command. Pairs
      with DISABLE_LOGIN_COMMAND so authentication state is managed
      out-of-band rather than from inside a transcript.
    remediation: 'Set "env": {"DISABLE_LOGOUT_COMMAND": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD012
    title: Claude Code DISABLE_ERROR_REPORTING is not set in settings.json
    severity: high
    category: claude
    description: |
      DISABLE_ERROR_REPORTING="1" stops Claude Code from uploading
      error stack traces (which can contain file paths, command
      arguments, and other working-directory metadata) to Anthropic.
    remediation: 'Set "env": {"DISABLE_ERROR_REPORTING": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD013
    title: Claude Code DISABLE_UPGRADE_COMMAND is not set in settings.json
    severity: warn
    category: claude
    description: |
      DISABLE_UPGRADE_COMMAND="1" hides the in-app upgrade command so
      Claude Code is upgraded only via the system package manager.
      This keeps install state managed by the platform's normal
      software pipeline.
    remediation: 'Set "env": {"DISABLE_UPGRADE_COMMAND": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD014
    title: Claude Code DISABLE_FEEDBACK_COMMAND is not set in settings.json
    severity: warn
    category: claude
    description: |
      DISABLE_FEEDBACK_COMMAND="1" hides the /feedback command, which
      submits free-form messages (and may include transcript context)
      to Anthropic. Disabling it prevents accidental upload from
      inside a working session.
    remediation: 'Set "env": {"DISABLE_FEEDBACK_COMMAND": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD015
    title: Claude Code DISABLE_EXTRA_USAGE_COMMAND is not set in settings.json
    severity: warn
    category: claude
    description: |
      DISABLE_EXTRA_USAGE_COMMAND="1" hides the extra usage reporting
      command, reducing the surface that emits usage information from
      inside a session.
    remediation: 'Set "env": {"DISABLE_EXTRA_USAGE_COMMAND": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD016
    title: Claude Code CLAUDE_CODE_DISABLE_FAST_MODE is not set in settings.json
    severity: warn
    category: claude
    description: |
      CLAUDE_CODE_DISABLE_FAST_MODE="1" turns off the /fast toggle so
      the model in use cannot be flipped mid-session. Keeps the
      runtime model deterministic for audit and reproducibility.
    remediation: 'Set "env": {"CLAUDE_CODE_DISABLE_FAST_MODE": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD017
    title: Claude Code DISABLE_INSTALL_GITHUB_APP_COMMAND is not set in settings.json
    severity: warn
    category: claude
    description: |
      DISABLE_INSTALL_GITHUB_APP_COMMAND="1" prevents Claude Code from
      installing GitHub Apps from inside a session. GitHub App
      installation grants persistent organization-level permissions
      and should be performed deliberately, not from a transcript.
    remediation: 'Set "env": {"DISABLE_INSTALL_GITHUB_APP_COMMAND": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD018
    title: Claude Code CLAUDE_CODE_DISABLE_CRON is not set in settings.json
    severity: info
    category: claude
    description: |
      CLAUDE_CODE_DISABLE_CRON="1" turns off scheduled/cron-style
      autonomous task execution. Removes a class of background
      activity that can run without the user being attached to the
      session.
    remediation: 'Set "env": {"CLAUDE_CODE_DISABLE_CRON": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD019
    title: Claude Code CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY is not set in settings.json
    severity: warn
    category: claude
    description: |
      CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY="1" suppresses periodic
      in-session feedback prompts. Removes an interactive surface
      that can interrupt a working session.
    remediation: 'Set "env": {"CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD020
    title: Claude Code CLAUDE_CODE_DISABLE_FILE_CHECKPOINTING is not set in settings.json
    severity: info
    category: claude
    description: |
      CLAUDE_CODE_DISABLE_FILE_CHECKPOINTING="1" disables the
      file-checkpointing feature, which writes snapshots of working
      files to local state. Disabling it reduces disk/IO usage and
      removes a source of stale snapshots.
    remediation: 'Set "env": {"CLAUDE_CODE_DISABLE_FILE_CHECKPOINTING": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD021
    title: Claude Code CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS is not set in settings.json
    severity: info
    category: claude
    description: |
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS="1" opts out of
      experimental beta features. Keeps the runtime to documented
      stable behaviour, which is preferable for reproducibility and
      auditability.
    remediation: 'Set "env": {"CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD022
    title: Claude Code FORCE_AUTOUPDATE_PLUGINS is not set in settings.json
    severity: warn
    category: claude
    description: |
      FORCE_AUTOUPDATE_PLUGINS="1" forces Claude Code plugins to
      auto-update so installed plugins do not drift behind upstream
      fixes. Keeps the plugin set on the latest published version.
    remediation: 'Set "env": {"FORCE_AUTOUPDATE_PLUGINS": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD023
    title: Claude Code IS_DEMO is not set in settings.json
    severity: warn
    category: claude
    description: |
      IS_DEMO="1" enables demo-mode affordances in Claude Code. This
      rule reflects a deliberate user-policy choice to run in demo
      mode; remove the rule (or override the env value) if your
      environment should not run in demo mode.
    remediation: 'Set "env": {"IS_DEMO": "1"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD024
    title: Claude Code disableAutoMode is not set to "disable" in settings.json
    severity: warn
    category: claude
    description: |
      disableAutoMode="disable" prevents Claude Code from automatically
      switching into autonomous modes that take actions without
      explicit per-turn confirmation. Forces the user to opt in to
      autonomous behaviour each time.
    remediation: 'Set "disableAutoMode": "disable" in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD025
    title: Claude Code disableDeepLinkRegistration is not set to "disable" in settings.json
    severity: high
    category: claude
    description: |
      disableDeepLinkRegistration="disable" stops Claude Code from
      registering itself as the handler for claude:// deep links.
      Removes a class of inbound URL handlers that other applications
      could otherwise invoke.
    remediation: 'Set "disableDeepLinkRegistration": "disable" in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD026
    title: Claude Code attribution.commit and attribution.pr are not empty in settings.json
    severity: info
    category: claude
    description: |
      Claude Code appends an attribution trailer to commit messages
      and PR bodies it generates. Setting attribution.commit and
      attribution.pr to empty strings removes these trailers, keeping
      authored artefacts free of tool-specific markers and avoiding
      leaking that Claude Code was used.
    remediation: 'Set "attribution": {"commit": "", "pr": ""} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD027
    title: Claude Code respectGitignore is not enabled in settings.json
    severity: warn
    category: claude
    description: |
      respectGitignore=true makes Claude Code honour .gitignore when
      reading files, so ignored files (often containing credentials,
      build outputs, or large vendored data) are not pulled into the
      conversation. Without it, ignored files can be read and may
      end up in transcripts or transmitted context.
    remediation: 'Set "respectGitignore": true in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD028
    title: Claude Code skipWebFetchPreflight is not enabled in settings.json
    severity: warn
    category: claude
    description: |
      skipWebFetchPreflight=true skips the OPTIONS preflight that
      Claude Code performs before WebFetch, removing an extra
      outbound request per fetch and avoiding leaking working-host
      identification metadata to targets that did not need it.
    remediation: 'Set "skipWebFetchPreflight": true in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD029
    title: Claude Code autoMemoryDirectory is not set to ".claude/memory" in settings.json
    severity: info
    category: claude
    description: |
      autoMemoryDirectory pins Claude Code's automatic memory store
      to a known location inside the project. Setting it to
      ".claude/memory" keeps memory files alongside the rest of the
      .claude directory so they can be reviewed, gitignored, or
      pruned as a unit.
    remediation: 'Set "autoMemoryDirectory": ".claude/memory" in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD030
    title: Claude Code plansDirectory is not set to ".claude/plans" in settings.json
    severity: info
    category: claude
    description: |
      plansDirectory pins where Claude Code writes implementation
      plans. Setting it to ".claude/plans" keeps plan artefacts
      alongside the rest of the .claude directory so they can be
      reviewed and managed as a unit.
    remediation: 'Set "plansDirectory": ".claude/plans" in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD031
    title: Claude Code sandbox.enabled is not true in settings.json
    severity: high
    category: claude
    description: |
      sandbox.enabled=true turns on the platform sandbox that
      isolates tool execution from the rest of the system. Without
      it, Bash and other tool calls run with the user's full
      permissions and have no enforced filesystem or network limits.
    remediation: 'Set "sandbox": {"enabled": true, ...} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD032
    title: Claude Code sandbox.autoAllowBashIfSandboxed is not false in settings.json
    severity: high
    category: claude
    description: |
      sandbox.autoAllowBashIfSandboxed=false keeps Bash calls in the
      explicit-permission flow even when the sandbox is active. With
      it set to true, Bash invocations are auto-approved when
      sandboxed, removing per-command user oversight.
    remediation: 'Set "sandbox": {"autoAllowBashIfSandboxed": false, ...} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD033
    title: Claude Code sandbox.allowUnsandboxedCommands is not false in settings.json
    severity: high
    category: claude
    description: |
      sandbox.allowUnsandboxedCommands=false prevents tool calls
      from running outside the sandbox. With it set to true, the
      assistant can request unsandboxed execution and the isolation
      boundary becomes optional rather than enforced.
    remediation: 'Set "sandbox": {"allowUnsandboxedCommands": false, ...} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD034
    title: Claude Code sandbox.network.allowManagedDomainsOnly is not true in settings.json
    severity: warn
    category: claude
    description: |
      sandbox.network.allowManagedDomainsOnly=true restricts outbound
      network calls to the explicitly allowed domain list. Without
      it, the sandboxed session can reach arbitrary hosts, defeating
      the point of the allowlist.
    remediation: 'Set "sandbox": {"network": {"allowManagedDomainsOnly": true, ...}} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD035
    title: Claude Code permissions.disableBypassPermissionsMode is not "disable" in settings.json
    severity: high
    category: claude
    description: |
      permissions.disableBypassPermissionsMode="disable" prevents Claude
      Code from entering bypass mode, which otherwise turns off the
      permission-prompt flow and lets tool calls run without user
      confirmation. Disabling the bypass mode forces every privileged
      action through the normal allow/deny review.
    remediation: 'Set "permissions": {"disableBypassPermissionsMode": "disable"} in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json)'
  - id: CLD036
    title: Claude Code permissions.deny missing network/exfiltration tool blocks
    severity: high
    category: claude
    description: |
      permissions.deny should block network/exfiltration binaries that
      Claude Code does not need: nc, netcat, socat, ssh, scp, rsync.
      These tools can be used to move data off-host or open inbound
      connections from a sandbox-escaped tool call. Blocking them at
      the permissions layer keeps the assistant's network surface to
      sanctioned channels (WebFetch, gh, etc.).
    remediation: |-
      Add the following to permissions.deny in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json):
              • "Bash(nc:*)"
              • "Bash(netcat:*)"
              • "Bash(socat:*)"
              • "Bash(ssh:*)"
              • "Bash(scp:*)"
              • "Bash(rsync:*)"
  - id: CLD037
    title: Claude Code permissions.deny missing destructive filesystem command blocks
    severity: high
    category: claude
    description: |
      permissions.deny should block destructive filesystem commands so
      Claude Code cannot wipe or relax permissions on host data:
      "chmod 777" (over-permissive), "chown" (ownership changes),
      "rm -rf /" and "rm -rf ~" (mass deletion), "dd" (raw block
      writes), and "mkfs" (filesystem creation). Blocking at the
      permissions layer prevents an inadvertent (or prompt-injected)
      tool call from causing irreversible damage.
    remediation: |-
      Add the following to permissions.deny in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json):
              • "Bash(chmod 777:*)"
              • "Bash(chown:*)"
              • "Bash(rm -rf /:*)"
              • "Bash(rm -rf ~:*)"
              • "Bash(dd:*)"
              • "Bash(mkfs:*)"
  - id: CLD038
    title: Claude Code permissions.deny missing destructive git command blocks
    severity: warn
    category: claude
    description: |
      permissions.deny should block git commands that publish history
      or rewrite local state without explicit user confirmation:
      "git push" (publishes commits remotely), "git tag" (publishes
      release markers), "git reset --hard" (discards uncommitted
      work). Blocking forces the user to invoke these out-of-band
      rather than from inside an autonomous tool call.
    remediation: |-
      Add the following to permissions.deny in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json):
              • "Bash(git push:*)"
              • "Bash(git tag:*)"
              • "Bash(git reset --hard:*)"
  - id: CLD039
    title: Claude Code permissions.deny missing home credential directory blocks
    severity: high
    category: claude
    description: |
      permissions.deny should block reads of home directories that
      hold long-lived credentials: ~/.ssh (private keys), ~/.aws
      (IAM access keys), ~/.gnupg (PGP keys), ~/.config/gh (GitHub
      CLI tokens), ~/.kube (cluster credentials), ~/.docker/config.json
      (registry tokens). Blocking at the permissions layer keeps
      credential material out of transcripts even if a tool call
      attempts to read it.
    remediation: |-
      Add the following to permissions.deny in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json):
              • "Read(~/.ssh/**)"
              • "Read(~/.aws/**)"
              • "Read(~/.gnupg/**)"
              • "Read(~/.config/gh/**)"
              • "Read(~/.kube/**)"
              • "Read(~/.docker/config.json)"
  - id: CLD040
    title: Claude Code permissions.deny missing project secret file blocks
    severity: high
    category: claude
    description: |
      permissions.deny should block reads of project-local secret
      files: .env files (env-style secrets), *.pem and *.key files
      (private keys/certs), id_rsa* and id_ed25519* (SSH keys
      checked into a project), and credentials* (generic credential
      filenames). Both top-level and recursive (** glob) patterns
      should be present so secrets in nested directories cannot be
      read either.
    remediation: |-
      Add the following to permissions.deny in ~/.claude/settings.json (or $XDG_CONFIG_HOME/claude/settings.json):
              • "Read(./.env)"
              • "Read(./.env.*)"
              • "Read(./*.pem)"
              • "Read(./*.key)"
              • "Read(./**/.env)"
              • "Read(./**/.env.*)"
              • "Read(./**/*.pem)"
              • "Read(./**/*.key)"
              • "Read(./**/id_rsa*)"
              • "Read(./**/id_ed25519*)"
              • "Read(./**/credentials*)"
  - id: CLD041
    title: Claude Desktop installed Native Messaging manifests for Chromium browsers
    severity: high
    category: claude
    description: |
      Claude Desktop for macOS silently installs a Native Messaging
      manifest at com.anthropic.claude_browser_extension.json under
      ~/Library/Application Support for several Chromium-based browser
      directories — including browsers that are not even installed on
      the machine (Brave, Edge, Opera, Vivaldi, Arc, Chromium, Chrome).
      The manifest pre-authorizes a small set of Chrome extension IDs
      to invoke a Claude Desktop helper binary outside the browser
      sandbox at user privilege. The file is rewritten on every Claude
      Desktop launch and is undocumented by Anthropic. Any extension
      whose ID matches one of the pre-authorized IDs and is installed
      in one of those browsers can reach the helper binary and access
      browser tabs. Mitigate by truncating each manifest to an empty
      file and setting the user-immutable (uchg) flag so Claude Desktop
      cannot rewrite it on next launch.
    remediation: |-
      Run:
      find ~/Library/Application\ Support -type f -name com.anthropic.claude_browser_extension.json -exec sh -c ': > "$1" && chflags uchg "$1"' _ {} \;
