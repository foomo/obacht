rules:
  - id: BRW001
    title: Homebrew auto-update is disabled
    severity: warn
    category: brew
    description: |
      Homebrew auto-update ensures that formulae and cask definitions
      are refreshed before installing or upgrading packages. Disabling
      it via HOMEBREW_NO_AUTO_UPDATE means security patches in
      dependencies may not be applied promptly.
    remediation: "Remove or unset the HOMEBREW_NO_AUTO_UPDATE environment variable"
  - id: BRW002
    title: Homebrew metadata is stale
    severity: warn
    category: brew
    description: |
      Homebrew caches formula and cask metadata locally. Stale metadata
      (older than 7 days) means newly published security patches in
      dependencies will not be discovered or installed when packages
      are added or upgraded. Refresh metadata regularly to ensure
      timely access to upstream fixes.
    remediation: "Run `brew update` to refresh Homebrew metadata"
  - id: BRW003
    title: Homebrew analytics is not disabled
    severity: warn
    category: brew
    description: |
      Homebrew collects anonymized analytics by default, including
      installed formulae, OS version, and CPU architecture. Setting
      HOMEBREW_NO_ANALYTICS=1 opts out of this telemetry collection.
    remediation: 'Export HOMEBREW_NO_ANALYTICS=1 in your shell profile, or run `brew analytics off`'
