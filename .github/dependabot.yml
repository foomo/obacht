# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/dependabot-2.0.json
version: 2

updates:
  - package-ecosystem: github-actions
    commit-message: { prefix: sec(gha) }
    open-pull-requests-limit: 0
    directory: '/'
    schedule:
      interval: daily
      timezone: Europe/Berlin
    groups:
      security:
        applies-to: security-updates
        patterns: [ '*' ]
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    commit-message: { prefix: sec(docker) }
    open-pull-requests-limit: 0
    directories: [ '**/*' ]
    schedule:
      interval: daily
      timezone: Europe/Berlin
    groups:
      security:
        applies-to: security-updates
        patterns: [ '*' ]
    cooldown:
      default-days: 3

  - package-ecosystem: gomod
    commit-message: { prefix: sec(gomod) }
    open-pull-requests-limit: 0
    directories: [ '**/*' ]
    schedule:
      interval: daily
      timezone: Europe/Berlin
    groups:
      security:
        applies-to: security-updates
        patterns: [ '*' ]
    cooldown:
      default-days: 3
